<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>房间通知</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="../../lib/layui-v2.5.5/css/layui.css" media="all">
    <link rel="stylesheet" href="../../css/public.css" media="all">
</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">
        <blockquote class="layui-elem-quote">房间通知列表</blockquote>
        <table class="layui-hide" id="currentTableId" lay-filter="currentTableFilter"></table>
    </div>
</div>
<script src="../../lib/layui-v2.5.5/layui.js" charset="utf-8"></script>
<script src="../../js/lay-config.js" charset="utf-8"></script>
<script>
    layui.use(['table', 'axios', 'storage'], function () {
        var table = layui.table,
            axios = layui.axios,
            storage = layui.storage;

        table.render({
            elem: '#currentTableId',
            url: API_BASE + '/notification/query',
            cols: [[
                {field: 'notiHead', title: '通知标题'},
                {field: 'notiContent', title: '通知内容'},
                {field: 'notiDate', title: '通知日期', templet: '<div>{{layui.util.toDateString(d.notiDate, "yyyy-MM-dd")}}</div>'},
                {field: 'notiType', title: '通知类型', templet: '<div>{{d.notiType == 0 ? "一般" : (d.notiType == 1 ? "重要" : "过期")}}</div>'}
            ]]
        });
    });
</script>
</body>
</html>
