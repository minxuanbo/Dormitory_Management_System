<style>
    .admin-dashboard .layui-card {border:1px solid #f2f2f2;border-radius:5px;}
    .admin-dashboard .data-card {text-align:center;padding:20px 10px;}
    .admin-dashboard .data-card .icon {font-size:40px;margin-bottom:10px;}
    .admin-dashboard .data-card .number {font-size:32px;font-weight:bold;color:#333;}
    .admin-dashboard .data-card .label {font-size:14px;color:#999;margin-top:5px;}
    .admin-dashboard .icon-total {color:#1e9fff;}
    .admin-dashboard .icon-pending {color:#ffb800;}
    .admin-dashboard .icon-processing {color:#16baaa;}
    .admin-dashboard .icon-reviewed {color:#5fb878;}
    .admin-dashboard .icon-satisfaction {color:#ff5722;}
    .admin-dashboard .layuimini-notice:hover {background:#f6f6f6;}
    .admin-dashboard .layuimini-notice {padding:10px 16px;clear:both;font-size:13px;cursor:pointer;position:relative;transition:background 0.2s ease-in-out;border-bottom:1px solid #f2f2f2;}
    .admin-dashboard .layuimini-notice:last-child {border-bottom:none;}
    .admin-dashboard .notice-title {font-weight:500;color:#333;}
    .admin-dashboard .notice-desc {color:#666;margin-top:5px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .admin-dashboard .notice-meta {margin-top:5px;font-size:12px;color:#999;}
    .admin-dashboard .notice-status {float:right;}
</style>
<div class="layuimini-container layuimini-page-anim">
    <div class="layuimini-main admin-dashboard">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-header"><i class="fa fa-dashboard" style="margin-right:10px;color:#1e9fff;"></i>核心数据概览</div>
                    <div class="layui-card-body">
                        <div class="layui-row layui-col-space10">
                            <div class="layui-col-xs6 layui-col-sm4 layui-col-md2">
                                <div class="data-card">
                                    <div class="icon icon-total"><i class="fa fa-clipboard"></i></div>
                                    <div class="number" id="totalCount">0</div>
                                    <div class="label">总工单</div>
                                </div>
                            </div>
                            <div class="layui-col-xs6 layui-col-sm4 layui-col-md2">
                                <div class="data-card">
                                    <div class="icon icon-pending"><i class="fa fa-clock-o"></i></div>
                                    <div class="number" id="pendingCount">0</div>
                                    <div class="label">待指派</div>
                                </div>
                            </div>
                            <div class="layui-col-xs6 layui-col-sm4 layui-col-md2">
                                <div class="data-card">
                                    <div class="icon icon-processing"><i class="fa fa-wrench"></i></div>
                                    <div class="number" id="processingCount">0</div>
                                    <div class="label">处理中</div>
                                </div>
                            </div>
                            <div class="layui-col-xs6 layui-col-sm4 layui-col-md2">
                                <div class="data-card">
                                    <div class="icon icon-reviewed"><i class="fa fa-check-circle"></i></div>
                                    <div class="number" id="reviewedCount">0</div>
                                    <div class="label">已评价</div>
                                </div>
                            </div>
                            <div class="layui-col-xs6 layui-col-sm4 layui-col-md2">
                                <div class="data-card">
                                    <div class="icon icon-satisfaction"><i class="fa fa-smile-o"></i></div>
                                    <div class="number" id="avgSatisfaction">0.0</div>
                                    <div class="label">平均满意度</div>
                                </div>
                            </div>
                            <div class="layui-col-xs6 layui-col-sm4 layui-col-md2">
                                <div class="data-card">
                                    <div class="icon" style="color:#a233c6;"><i class="fa fa-users"></i></div>
                                    <div class="number" id="repairerCount">0</div>
                                    <div class="label">维修人员</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-header"><i class="fa fa-list-alt" style="margin-right:10px;color:#16baaa;"></i>最新报修列表（前10条）</div>
                    <div class="layui-card-body" style="padding:0;">
                        <div id="latestRepairList">
                            <div style="text-align:center;padding:40px;color:#999;">
                                <i class="fa fa-spinner fa-spin" style="font-size:24px;"></i>
                                <div style="margin-top:10px;">加载中...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    layui.use(['jquery', 'layer', 'axios', 'miniAdmin'], function () {
        var $ = layui.jquery,
            layer = layui.layer,
            axios = layui.axios,
            miniAdmin = layui.miniAdmin;

        function getStatusText(status) {
            switch (status) {
                case 0: return '<span class="layui-badge layui-bg-gray">待指派</span>';
                case 1: return '<span class="layui-badge layui-bg-orange">待接单</span>';
                case 2: return '<span class="layui-badge layui-bg-blue">维修中</span>';
                case 3: return '<span class="layui-badge layui-bg-green">已完成</span>';
                case 4: return '<span class="layui-badge layui-bg-cyan">已评价</span>';
                default: return '<span class="layui-badge">未知</span>';
            }
        }

        function getUrgencyText(urgency) {
            switch (urgency) {
                case 0: return '<span class="layui-badge layui-bg-cyan">普通</span>';
                case 1: return '<span class="layui-badge layui-bg-orange">紧急</span>';
                case 2: return '<span class="layui-badge layui-bg-red">非常紧急</span>';
                default: return '<span class="layui-badge">未知</span>';
            }
        }

        function loadDashboardData() {
            axios.post('/repair/statistics').then(function (res) {
                var data = res.data || res;
                $('#totalCount').text(data.totalCount || 0);
                $('#pendingCount').text(data.pendingCount || 0);
                $('#processingCount').text(data.processingCount || 0);
                $('#reviewedCount').text(data.reviewedCount || 0);
                $('#avgSatisfaction').text(data.avgSatisfaction != null ? parseFloat(data.avgSatisfaction).toFixed(1) : '0.0');
                $('#repairerCount').text(data.repairerCount || 0);
            }).catch(function () {
                $('#totalCount').text('--');
                $('#pendingCount').text('--');
                $('#processingCount').text('--');
                $('#reviewedCount').text('--');
                $('#avgSatisfaction').text('--');
                $('#repairerCount').text('--');
            });
        }

        function loadLatestRepairs() {
            axios.post('/repair/query', {page: 1, limit: 10}).then(function (res) {
                var list = (res.data && Array.isArray(res.data)) ? res.data.slice(0, 10) : [];

                var html = '';
                if (list.length === 0) {
                    html = '<div style="text-align:center;padding:40px;color:#999;">暂无报修记录</div>';
                } else {
                    for (var i = 0; i < list.length; i++) {
                        var item = list[i];
                        var studentName = item.user ? item.user.userName : (item.stuId || '--');
                        var buildingRoom = '';
                        if (item.building && item.room) {
                            buildingRoom = item.building.buildingName + ' ' + item.room.brand;
                        } else if (item.buildingId && item.roomId) {
                            buildingRoom = item.buildingId + '栋' + (item.room ? item.room.brand : (item.roomId + '号'));
                        } else if (item.buildingName) {
                            buildingRoom = item.buildingName;
                        } else {
                            buildingRoom = '--';
                        }
                        var repairerName = item.repairer ? item.repairer.userName : (item.repairerId || '--');
                        html += '<div class="layuimini-notice">';
                        html += '<div class="notice-status">' + getStatusText(item.repStatus) + '</div>';
                        html += '<div class="notice-title">';
                        html += '<span style="margin-right:10px;">#' + (item.id || '--') + '</span>';
                        html += '<span style="margin-right:10px;">' + (item.repItem || '--') + '</span>';
                        html += getUrgencyText(item.urgency);
                        html += '</div>';
                        html += '<div class="notice-desc">' + (item.description || '无描述') + '</div>';
                        html += '<div class="notice-meta">';
                        html += '<i class="fa fa-user" style="margin-right:5px;"></i>' + studentName;
                        html += '<span style="margin:0 10px;">|</span>';
                        html += '<i class="fa fa-building" style="margin-right:5px;"></i>' + buildingRoom;
                        html += '<span style="margin:0 10px;">|</span>';
                        html += '<i class="fa fa-wrench" style="margin-right:5px;"></i>' + repairerName;
                        html += '<span style="margin:0 10px;">|</span>';
                        html += '<i class="fa fa-clock-o" style="margin-right:5px;"></i>' + (item.repDate || item.submitTime || '--');
                        html += '</div>';
                        html += '</div>';
                    }
                }
                $('#latestRepairList').html(html);
            }).catch(function () {
                $('#latestRepairList').html('<div style="text-align:center;padding:40px;color:#999;">加载失败，请刷新重试</div>');
            });
        }

        loadDashboardData();
        loadLatestRepairs();
    });
</script>
