

<div class="layuimini-main">
    <div class="layui-form layuimini-form userForm" style="width: 80%;margin-top: 20px;">
        <div class="layui-form-item">
            <label class="layui-form-label required">ID</label>
            <div class="layui-input-block">
                <input type="text" name="id" lay-verify="required" lay-reqtext="学号/工号不能为空" placeholder="学号/工号" value="" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label required">姓名</label>
            <div class="layui-input-block">
                <input type="text" name="userName" lay-verify="required" lay-reqtext="姓名不能为空" placeholder="姓名" value="" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label required">密码</label>
            <div class="layui-input-block">
                <input type="password" name="userPwd" lay-verify="required" lay-reqtext="密码不能为空" placeholder="密码" value="123456" class="layui-input">
                <tip>默认：123456</tip>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label required">性别</label>
            <div class="layui-input-block">
                <input type="radio" name="gender" value=0 title="女‍🙋🏻‍♀️" checked="">
                <input type="radio" name="gender" value=1 title="男🙋🏻‍♂️">
<!--                <input type="radio" name="gender" value=2 title="保密🤐">-->
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">邮箱</label>
            <div class="layui-input-block">
                <input type="email" name="email" placeholder="example@email.com" value="" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">联系电话</label>
            <div class="layui-input-block">
                <input type="text" name="phone" placeholder="联系电话" value="" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">楼栋</label>
            <div class="layui-input-block">
                <select name="buildingId" id="buildingSelect" lay-filter="buildingSelect">
                    <option value="">请选择楼栋</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item" id="floorFormItem" style="display:none;">
            <label class="layui-form-label">楼层</label>
            <div class="layui-input-block">
                <select name="floor" id="floorSelect" lay-filter="floorSelect">
                    <option value="">请选择楼层</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item" id="roomFormItem" style="display:none;">
            <label class="layui-form-label">房间</label>
            <div class="layui-input-block">
                <select name="roomId" id="roomSelect">
                    <option value="">请选择房间</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item userTypeFormItem">
            <label class="layui-form-label required">角色</label>
            <div class="layui-input-block">
                <select name="userType" lay-verify="required">
                    <option value="0">学生👨🏻‍🎓</option>
                    <option value="1">维修人员🔧</option>
<!--                    <option value="2">后勤中心🏫</option>-->
                </select>
<!--                <input type="radio" name="userType" value=0 title="学生👨🏻‍🎓" checked="">-->
<!--                <input type="radio" name="userType" value=1 title="维修人员🔧">-->
<!--                <input type="radio" name="userType" value=2 title="后勤🏫">-->
            </div>
        </div>

        <div class="layui-form-item" style="text-align: center;margin-top: 30px;">
            <div class="layui-input-block">
                <button class="layui-btn layui-btn-normal" lay-submit lay-filter="saveBtn">确认保存</button>
            </div>
        </div>
    </div>

</div>
<script>
    layui.use(['form', 'table', 'axios', 'miniAdmin'], function () {
        let form = layui.form,
            layer = layui.layer,
            table = layui.table,
            axios = layui.axios,
            miniAdmin = layui.miniAdmin,
            $ = layui.$;

        /**
         * 初始化表单，要加上，不然刷新部分组件可能会不加载
         */
        form.render();

        // 从 URL 读取 userType 参数（维修人员管理=1 / 学生管理=0），固定角色不可改
        var urlParams = new URLSearchParams(location.search);
        var urlUserType = urlParams.get('userType');
        if (urlUserType !== null && urlUserType !== '') {
            $('.userTypeFormItem').hide();
            $('<input type="hidden" name="userType" value="' + urlUserType + '">').appendTo('.userForm');
        }

        // 当前弹出层，防止ID被覆盖
        let parentIndex = layer.index;

        // ===== 宿舍选择：楼栋 → 楼层 → 房间 =====
        var buildingList = [];

        function loadBuildings() {
            axios.post('building/query', 'page=1&limit=100').then(function (res) {
                if (res.code === 200 && res.data) {
                    buildingList = res.data;
                    var html = '<option value="">请选择楼栋</option>';
                    buildingList.forEach(function (b) {
                        html += '<option value="' + b.id + '">' + b.buildingName + '（' + (b.floorNum || 0) + '层）</option>';
                    });
                    $('#buildingSelect').html(html);
                    form.render('select');
                }
            });
        }

        function loadFloors(buildingId) {
            var floorNum = 1;
            buildingList.forEach(function (b) {
                if (String(b.id) === String(buildingId)) {
                    floorNum = b.floorNum || 1;
                }
            });
            var html = '<option value="">请选择楼层</option>';
            for (var f = 1; f <= floorNum; f++) {
                html += '<option value="' + f + '">' + f + ' 楼</option>';
            }
            $('#floorSelect').html(html);
            $('#roomSelect').html('<option value="">请选择房间</option>');
            $('#floorFormItem').show();
            $('#roomFormItem').hide();
            form.render('select');
        }

        function loadRooms(buildingId, floor) {
            axios.post('room/query', {buildingId: buildingId, floor: floor}).then(function (res) {
                if (res.code === 200 && res.data) {
                    var html = '<option value="">请选择房间</option>';
                    res.data.forEach(function (r) {
                        html += '<option value="' + r.id + '">' + r.floor + '楼 ' + r.brand + '（' + (r.roomCapacity || 0) + '人）</option>';
                    });
                    $('#roomSelect').html(html);
                    $('#roomFormItem').show();
                    form.render('select');
                }
            });
        }

        loadBuildings();

        form.on('select(buildingSelect)', function (data) {
            if (data.value) {
                loadFloors(data.value);
            } else {
                $('#floorFormItem, #roomFormItem').hide();
            }
        });

        form.on('select(floorSelect)', function (data) {
            var bid = $('#buildingSelect').val();
            if (bid && data.value) {
                loadRooms(bid, data.value);
            }
        });

        //监听提交
        form.on('submit(saveBtn)', function (data) {
            axios.post('user/create', data.field).then(function (response) {
                if(response.code === 200){
                    layer.msg(response.msg);                        // layer的成功提示
                    // miniAdmin.success(response.msg);             // miniAdmin的成功提示
                    // layui.table.reload('currentTableId');        // 刷新页面
                    window.reload();                                // 同上
                }
                layer.close(parentIndex);                           // 关闭弹出层
            }).catch(function (error) {
                layer.msg(error);
            });
            return false;
        });

    });
</script>
