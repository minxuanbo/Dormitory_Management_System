<body class="layui-layout-body layuimini-all">
<div class="layui-layout layui-layout-admin">
    <div class="layui-header header">
        <div class="layui-logo layuimini-logo layuimini-back-home"></div>
        <div class="layuimini-header-content">
            <a>
                <div class="layuimini-tool"><i title="展开" class="fa fa-outdent" data-side-fold="1"></i></div>
            </a>
            <ul class="layui-nav layui-layout-right">
                <li class="layui-nav-item" lay-unselect>
                    <a href="javascript:;" data-refresh="刷新"><i class="fa fa-refresh"></i></a>
                </li>
                <li class="layui-nav-item" lay-unselect>
                    <a href="javascript:;" id="noticeBell" title="通知中心" style="position:relative;"><i class="fa fa-bell"></i><span class="layui-badge" id="noticeBadge" style="display:none;position:absolute;top:8px;left:24px;height:16px;line-height:16px;padding:0 4px;font-size:11px;min-width:16px;text-align:center;"></span></a>
                </li>
                <li class="layui-nav-item mobile layui-hide-xs" lay-unselect>
                    <a href="javascript:;" data-check-screen="full"><i class="fa fa-arrows-alt"></i></a>
                </li>
                <li class="layui-nav-item layuimini-setting">
                    <a href="javascript:;" id="userName">管理员</a>
                    <dl class="layui-nav-child">
                        <dd>
                            <hr>
                        </dd>
                        <dd>
                            <a href="javascript:;" class="login-out">退出登录</a>
                        </dd>
                    </dl>
                </li>
            </ul>
        </div>
    </div>
    <div class="layui-side layui-bg-black layuimini-menu-left">
    </div>

        <div class="layuimini-loader-inner"></div>
    </div>
    <div class="layuimini-make"></div>
    <div class="layuimini-site-mobile"><i class="layui-icon"></i></div>

        <div class="layuimini-content-page">
        </div>
    </div>
</div>
<script src="../lib/layui-v2.5.5/layui.js" charset="utf-8"></script>
<script src="../js/lay-config.js?v=2.0.0" charset="utf-8"></script>
<script>
    var ADMIN_MENU = [
        {
            title: "首页",
            icon: "fa fa-home",
            href: "admin-dashboard.html",
            target: "_self"
        },
        {
            title: "工单管理",
            icon: "fa fa-clipboard",
            href: "",
            child: [
                {title: "全部工单", href: "admin/repair-manage.html", icon: "fa fa-list", target: "_self"},
                {title: "数据统计", href: "admin/statistics.html", icon: "fa fa-bar-chart", target: "_self"},
                {title: "满意度分析", href: "admin/satisfaction.html", icon: "fa fa-smile-o", target: "_self"}
            ]
        },
        {
            title: "用户管理",
            icon: "fa fa-users",
            href: "",
            child: [
                {title: "维修人员管理", href: "user/list.html?userType=1", icon: "fa fa-wrench", target: "_self"},
                {title: "学生管理", href: "user/list.html?userType=0", icon: "fa fa-graduation-cap", target: "_self"}
            ]
        },
        {
            title: "宿舍管理",
            icon: "fa fa-building",
            href: "",
            child: [
                {title: "楼栋管理", href: "building/list.html", icon: "fa fa-building-o", target: "_self"},
                {title: "房间管理", href: "room/list.html", icon: "fa fa-bed", target: "_self"}
            ]
        },
        {
            title: "通知中心",
            icon: "fa fa-bell-o",
            href: "notification-center.html",
            target: "_self"
        }
    ];

    layui.use(['jquery', 'layer', 'miniAdmin', 'storage', 'axios', 'miniMenu'], function () {
        var $ = layui.jquery,
            layer = layui.layer,
            storage = layui.storage,
            axios = layui.axios,
            miniAdmin = layui.miniAdmin,
            miniMenu = layui.miniMenu;

        if(!storage.getToken()){
            location.href = 'login.html';
        }

        var user = storage.get('user');
        if (user) {
            $('#userName').html(user.userName || '管理员');
        }

        var menuData = miniMenu.transformMenu(ADMIN_MENU, 0);
        var options = {
            iniUrl: "",
            clearUrl: "",
            renderPageVersion: true,
            bgColorDefault: false,
            multiModule: false,
            menuChildOpen: false,
            loadingTime: 0,
            pageAnim: true,
            logoInfo: {
                title: "宿舍报修系统",
                image: "../images/newlogo.svg",
                href: ""
            },
            homeInfo: {
                title: "首页",
                href: "admin-dashboard.html"
            },
            menuInfo: menuData
        };
        miniAdmin.render(options);

        $('.login-out').on("click", function () {
            storage.clear();
            layer.msg('退出登录成功', {icon: 1, time: 500}, function () {
                window.location = 'login.html';
            });
        });

        // ===== 站内通知：顶栏 + 侧边菜单未读角标（30秒轮询） =====
        // 给侧边菜单“通知中心”项注入角标（miniMenu 动态渲染，需等 DOM 就绪）
        function injectMenuBadge() {
            var $link = $('a[layuimini-href="notification-center.html"]');
            if ($link.length && !$link.find('.notice-menu-badge').length) {
                $link.find('.layui-left-nav').append('<span class="layui-badge layui-badge-dot notice-menu-badge" style="display:none;margin-left:6px;"></span>');
            }
            return $link.length > 0;
        }
        function setNoticeBadges(count) {
            count = parseInt(count, 10) || 0;
            // 顶栏铃铛
            if (count > 0) {
                $('#noticeBadge').text(count > 99 ? '99+' : count).show();
            } else {
                $('#noticeBadge').hide();
            }
            // 侧边菜单
            var $menuBadge = $('.notice-menu-badge');
            if (count > 0) {
                $menuBadge.show();
            } else {
                $menuBadge.hide();
            }
        }
        function refreshNoticeBadge() {
            axios.post('notification/unread_count').then(function (res) {
                var count = (res && res.code === 200 && res.data) ? parseInt(res.data, 10) : 0;
                setNoticeBadges(count);
            }).catch(function () {});
        }
        window.refreshNoticeBadge = refreshNoticeBadge;   // 供通知中心页面操作后刷新
        // 菜单由 miniMenu 异步渲染，轮询注入直到成功（最多尝试若干次）
        (function tryInject(times) {
            if (injectMenuBadge()) return;
            if (times > 0) setTimeout(function () { tryInject(times - 1); }, 300);
        })(20);
        refreshNoticeBadge();
        setInterval(refreshNoticeBadge, 30000);
        $('#noticeBell').on('click', function () {
            layui.miniPage.hashChange('notification-center.html');
        });
    });
</script>
</body>
</html>
