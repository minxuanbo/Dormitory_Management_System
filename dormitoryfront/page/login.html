<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>宿舍报修系统</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="../images/newlogo.svg">
    <link rel="stylesheet" href="../lib/layui-v2.5.5/css/layui.css" media="all">

    <!--[if lt IE 9]>
    <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
    <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: url(../images/backpacks-hanging-on-hooks.jpg) no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(20, 70, 120, 0.78), rgba(30, 139, 228, 0.62));
            z-index: 0;
        }
        .login-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            z-index: 1;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.22);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #148be4, #1e6fd9);
            padding: 34px 0 28px;
            text-align: center;
            color: #fff;
            position: relative;
        }
        .login-header::before {
            content: '';
            position: absolute;
            width: 74px;
            height: 74px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 0 74px 0 0;
            left: 0;
            top: 42px;
        }
        .login-header::after {
            content: '';
            position: absolute;
            width: 96px;
            height: 96px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            right: -18px;
            top: -18px;
        }
        .login-header img {
            width: 54px;
            height: 54px;
            margin-bottom: 10px;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.15));
            position: relative;
            z-index: 1;
        }
        .login-header h2 {
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 2px;
            margin: 0;
            position: relative;
            z-index: 1;
        }
        .login-header p {
            font-size: 13px;
            opacity: 0.92;
            margin: 6px 0 0;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        .login-body {
            padding: 36px 46px 32px;
        }
        .login-item {
            position: relative;
            margin-bottom: 24px;
            border-bottom: 1px solid #d0dbe8;
            transition: border-color 0.3s;
        }
        .login-item:focus-within {
            border-bottom-color: #148be4;
        }
        .login-item .icon {
            display: inline-block;
            width: 30px;
            height: 22px;
            vertical-align: middle;
            background: url(../images/icon-login.png) no-repeat;
        }
        .login-item .icon-user { background-position: -54px 0; }
        .login-item .icon-pwd { background-position: -106px 0; }
        .login-item input {
            display: inline-block;
            width: 260px;
            height: 22px;
            padding: 0;
            border: 0;
            outline: 0;
            font-size: 14px;
            letter-spacing: 0;
            background: transparent;
            vertical-align: middle;
        }
        .bind-password {
            display: inline-block;
            width: 20px;
            height: 16px;
            background: url(../images/icon-login.png) no-repeat 0 -43px;
            position: absolute;
            right: 2px;
            top: 2px;
            cursor: pointer;
        }
        .bind-password.icon-5 {
            background-position: -55px -43px;
        }
        .login-tip-row {
            height: 18px;
            line-height: 18px;
            margin-top: -8px;
            margin-bottom: 18px;
            text-align: right;
        }
        .login-tip-row a {
            font-size: 12px;
            color: #148be4;
            text-decoration: none;
        }
        .login-tip-row a:hover {
            color: #1e6fd9;
        }
        .login-btn {
            width: 100%;
            height: 44px;
            background: linear-gradient(135deg, #148be4, #1e6fd9);
            border-radius: 22px;
            text-align: center;
            line-height: 44px;
            color: #fff;
            font-size: 15px;
            letter-spacing: 2px;
            cursor: pointer;
            border: none;
            box-shadow: 0 6px 16px rgba(20, 111, 217, 0.32);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(20, 111, 217, 0.4);
        }
        .footer {
            left: 0;
            bottom: 0;
            color: #fff;
            width: 100%;
            position: absolute;
            text-align: center;
            line-height: 30px;
            padding-bottom: 14px;
            font-size: 13px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.35);
            z-index: 1;
        }
        @media screen and (max-width: 480px) {
            .login-wrapper { width: 90%; }
            .login-body { padding: 28px 28px 26px; }
            .login-item input { width: calc(100% - 60px); }
        }
        input::-webkit-input-placeholder { color: #a6aebf; }
        input::-moz-placeholder { color: #a6aebf; }
        input:-moz-placeholder { color: #a6aebf; }
        input:-ms-input-placeholder { color: #a6aebf; }
        input:-webkit-autofill { -webkit-box-shadow: 0 0 0 1000px #fff inset !important; }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <img src="../images/newlogo.svg" alt="logo">
            <h2>宿舍报修系统</h2>
            <p>在线报修 · 快速响应 · 贴心服务</p>
        </div>
        <form class="layui-form login-body">
            <div class="login-item">
                <span class="icon icon-user"></span>
                <input type="text" name="userName" lay-verify="required" autocomplete="off" placeholder="请输入登录账号" maxlength="24">
            </div>
            <div class="login-item">
                <span class="icon icon-pwd"></span>
                <input type="password" name="userPwd" lay-verify="required" autocomplete="off" placeholder="请输入密码" maxlength="20">
                <span class="bind-password"></span>
            </div>
            <div class="login-tip-row">
                <a href="javascript:layer.msg('请联系宿管管理员重置密码');">忘记密码？</a>
            </div>
            <div class="layui-form-item" style="margin: 0;">
                <button class="login-btn" lay-submit="" lay-filter="login">立即登录</button>
            </div>
        </form>
    </div>
</div>
<div class="footer">
    ©Copyright 2020-2026 宿舍报修系统
</div>
<script src="../lib/layui-v2.5.5/layui.js" charset="utf-8"></script>
<script src="../js/lay-config.js" charset="utf-8"></script>
<script>
    layui.use(['form', 'jquery', 'axios', 'layer', 'storage'], function () {
        var $ = layui.jquery,
            form = layui.form,
            layer = layui.layer,
            axios = layui.axios,
            storage = layui.storage;

        if (top.location !== self.location) top.location = self.location;

        $('.bind-password').on('click', function () {
            var $pwd = $("input[name='userPwd']");
            if ($(this).hasClass('icon-5')) {
                $(this).removeClass('icon-5');
                $pwd.attr('type', 'password');
            } else {
                $(this).addClass('icon-5');
                $pwd.attr('type', 'text');
            }
        });

        form.on('submit(login)', function (data) {
            data = data.field;
            axios({
                method: 'post',
                url: '/login',
                data: data
            }).then(function (res) {
                if (res.code === 200) {
                    storage.setToken(res.data.token);
                    storage.set('user', res.data.user);
                    var userType = res.data.user.userType;
                    if (userType === 0) {
                        location.href = 'student-index.html';
                    } else if (userType === 1) {
                        location.href = 'repairer-index.html';
                    } else if (userType === 2) {
                        location.href = 'admin-index.html';
                    } else {
                        location.href = 'index.html';
                    }
                } else {
                    layer.msg(res.msg);
                }
            }).catch(function () {
                layer.msg('登录失败，请检查网络');
            });
            return false;
        });
    });
</script>
</body>
</html>
