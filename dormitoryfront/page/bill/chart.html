<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>水电消耗</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="../../lib/layui-v2.5.5/css/layui.css" media="all">
    <link rel="stylesheet" href="../../css/public.css" media="all">
</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">
        <blockquote class="layui-elem-quote">水电消耗柱状图</blockquote>
        <div id="chartMain" style="width:100%;height:400px;"></div>
    </div>
</div>
<script src="../../lib/layui-v2.5.5/layui.js" charset="utf-8"></script>
<script src="../../js/lay-config.js" charset="utf-8"></script>
<script>
    layui.use(['echarts', 'axios', 'storage'], function () {
        var echarts = layui.echarts,
            axios = layui.axios;

        var chartDom = document.getElementById('chartMain');
        var myChart = echarts.init(chartDom);
        var option = {
            title: { text: '水电消耗统计' },
            tooltip: {},
            legend: { data: ['用水量(吨)', '用电量(度)'] },
            xAxis: { type: 'category', data: [] },
            yAxis: { type: 'value' },
            series: [
                { name: '用水量(吨)', type: 'bar', data: [] },
                { name: '用电量(度)', type: 'bar', data: [] }
            ]
        };
        myChart.setOption(option);
    });
</script>
</body>
</html>
