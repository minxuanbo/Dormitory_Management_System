<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>数据统计</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="../../lib/layui-v2.5.5/css/layui.css" media="all">
    <link rel="stylesheet" href="../../css/public.css" media="all">
</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">
        <blockquote class="layui-elem-quote">水电账单数据统计</blockquote>
        <table class="layui-hide" id="currentTableId" lay-filter="currentTableFilter"></table>
    </div>
</div>
<script src="../../lib/layui-v2.5.5/layui.js" charset="utf-8"></script>
<script src="../../js/lay-config.js" charset="utf-8"></script>
<script>
    layui.use(['table', 'axios', 'storage'], function () {
        var table = layui.table,
            axios = layui.axios;

        table.render({
            elem: '#currentTableId',
            url: API_BASE + '/bill/query',
            cols: [[
                {field: 'billYear', title: '年份'},
                {field: 'billMonth', title: '月份'},
                {field: 'waterUsed', title: '用水量(吨)'},
                {field: 'waterFee', title: '水费(元)'},
                {field: 'energyUsed', title: '用电量(度)'},
                {field: 'energyFee', title: '电费(元)'},
                {field: 'totalFee', title: '总费用(元)'},
                {field: 'paid', title: '缴费状态', templet: '<div>{{d.paid == 1 ? "已缴费" : "未缴费"}}</div>'}
            ]]
        });
    });
</script>
</body>
</html>
